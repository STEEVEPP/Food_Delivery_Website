server {
    listen 80;
    server_name localhost;
    root   /usr/share/nginx/html;
    index  index.html;

    # This block handles requests for the /admin path
    location /admin {
        # This line rewrites /admin/foo to /foo before processing
        rewrite ^/admin/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Fallback for any other requests
    location / {
        try_files $uri $uri/ /index.html;
    }
}
