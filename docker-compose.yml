version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "4000:4000" # Expose backend on host port 4000

  frontend:
    build: ./frontend
    ports:
      - "5173:80" # Expose frontend on host port 5173

  admin:
    build: ./admin
    ports:
      - "5174:80" # Expose admin on host port 5174
